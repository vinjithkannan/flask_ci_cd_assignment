name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Python
      ####################################################

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ####################################################
      # Test
      ####################################################

      - name: Run Tests
        run: |
          pytest

      ####################################################
      # Configure AWS
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################
      # Login to ECR
      ####################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Build Docker Image
      ####################################################

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      ####################################################
      # Push Docker Image
      ####################################################

      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      ####################################################
      # Setup SSH Key
      ####################################################

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      ####################################################
      # Deploy
      ####################################################

      - name: Deploy to EC2
        run: |

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login \
          --username AWS \
          --password-stdin ${{ steps.login-ecr.outputs.registry }}

          docker pull \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          docker stop flask-app || true

          docker rm flask-app || true

          docker run -d \
          --name flask-app \
          -p 80:5000 \
          -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
          -e MONGODB_USERNAME='${{ secrets.MONGODB_USERNAME }}' \
          -e MONGODB_PASSWORD='${{ secrets.MONGODB_PASSWORD }}' \
          -e MONGO_URI='${{ secrets.MONGO_URI }}' \
           ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          sleep 10

          curl --fail http://localhost/health

          EOF

      ####################################################
      # Success Email
      ####################################################

      - name: Send Success Email
        if: success()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            ✅ SUCCESS - Flask Deployment

          to: ${{ secrets.EMAIL_TO }}

          from: GitHub Actions

          body: |
            Deployment Status : SUCCESS

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Docker Image:
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            EC2 Host:
            ${{ secrets.EC2_HOST }}

            Workflow:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      ####################################################
      # Failure Email
      ####################################################

      - name: Send Failure Email
        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            ❌ FAILED - Flask Deployment

          to: ${{ secrets.EMAIL_TO }}

          from: GitHub Actions

          body: |
            Deployment Status : FAILED

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Failed Stage:
            Check the workflow logs below.

            Workflow:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}